name: Actualizar Remote Config
on:
  push:
    paths:
      - "**.json" # Se activa al subir un nuevo archivo .json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 'Autenticar en Firebase'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: 'Configurar Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Actualizar Remote Config'
        run: |
          # 1. Obtener el nombre del archivo recién subido
          FILENAME=$(ls -t *.json | head -n 1)
          NEW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/$FILENAME"
          
          # 2. Obtener el ID del proyecto desde el secreto
          PROJECT_ID=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | jq -r .project_id)
          TOKEN=$(gcloud auth print-access-token)
          
          # 3. Descargar la plantilla actual de Remote Config
          curl -X GET "https://firebaseremoteconfig.googleapis.com/v1/projects/$PROJECT_ID/remoteConfig" \
            -H "Authorization: Bearer $TOKEN" -o config.json
          
          # 4. Cambiar el valor de URL_NEW_UPDATE
          jq --arg url "$NEW_URL" '.parameters.URL_NEW_UPDATE.defaultValue.value = $url' config.json > updated_config.json
          
          # 5. Subir la nueva plantilla a Firebase
          curl -X PUT "https://firebaseremoteconfig.googleapis.com/v1/projects/$PROJECT_ID/remoteConfig" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "If-Match: *" -d @updated_config.json
          
          echo "Firebase actualizado con la URL: $NEW_URL"
