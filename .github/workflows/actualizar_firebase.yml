name: Actualizar Remote Config Turbo
on:
  push:
    paths:
      - "**.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 'Actualizar Firebase'
        run: |
          # 1. Obtener el nombre del archivo
          FILENAME=$(git log -1 --name-only --pretty="" | grep ".json" | grep -v ".github" | head -n 1)
          NEW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/$FILENAME"
          
          # 2. Obtener Token de forma rápida usando la llave secreta
          # Extraemos los datos del JSON
          CLIENT_EMAIL=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | jq -r .client_email)
          PRIVATE_KEY=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | jq -r .private_key)
          PROJECT_ID=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | jq -r .project_id)
          
          # Usamos una acción ligera para obtener el token de acceso
          echo "Generando token para $PROJECT_ID..."
          
      - name: 'Auth y Push'
        uses: 'google-github-actions/auth@v2'
        id: 'auth'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: 'access_token'

      - name: 'Update via API'
        run: |
          FILENAME=$(git log -1 --name-only --pretty="" | grep ".json" | grep -v ".github" | head -n 1)
          NEW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/$FILENAME"
          PROJECT_ID=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | jq -r .project_id)
          
          # Descargar y actualizar en un solo paso rápido
          curl -X GET "https://firebaseremoteconfig.googleapis.com/v1/projects/$PROJECT_ID/remoteConfig" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" -o config.json
          
          jq --arg url "$NEW_URL" '.parameters.URL_NEW_UPDATE.defaultValue.value = $url' config.json > updated.json
          
          curl -X PUT "https://firebaseremoteconfig.googleapis.com/v1/projects/$PROJECT_ID/remoteConfig" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -H "If-Match: *" -d @updated.json
